; AnyMouse Teensy 4.1 bridge: USB host (mouse in) -> octant vectoring -> USB device (PC out), both High-Speed.
;   tools/make_core.sh      once: builds ./fw, the Teensy framework with the 8 kHz mouse endpoint patch
;   pio run -t upload       builds, reboots the Teensy into its bootloader on its own and flashes
; Serial console is the Teensy's USB serial (/dev/ttyACM0); it only talks while the host holds DTR.
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
platform_packages = framework-arduinoteensy @ symlink://./fw
upload_protocol = teensy-cli
build_unflags = -D USB_SERIAL
build_flags =
    -D USB_AMV_DONGLE
    -I ../../common
