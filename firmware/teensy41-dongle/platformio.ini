; AnyMouse Teensy 4.1 dongle: USB host (mice in) -> octant vectoring -> USB device (PC out), both High-Speed,
; plus the vendor channel and OpenMouse's own drivers in QuickJS-ng (see teensy41-dongle_README.md).
;   tools/make_core.sh      once: builds ./fw, the Teensy framework with the AnyMouse USB type and core patches
;   pio run -t upload       builds, reboots the Teensy into its bootloader on its own and flashes
; Serial console is the Teensy's USB serial (/dev/ttyACM0); it only talks while the host holds DTR.
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
platform_packages = framework-arduinoteensy @ symlink://./fw
; teensy-gui: the bundled teensy_loader_cli (2.2) holds images in a 1 MB buffer and cannot flash this 2 MB
; image; the Teensy Loader app (same package) can. It opens a small window and programs on its own.
upload_protocol = teensy-gui
; the Teensy 4.1 linker script plus one rule: the OpenMouse engine's code and constants stay in flash
board_build.ldscript = teensy41_flash_js.ld
build_unflags = -D USB_SERIAL
build_flags =
    -D USB_AMV_DONGLE
    -I ../../common
    -I ../esp32p4-dongle/components/amv_catalog/include
    -I ../esp32p4-dongle/components/amv_hid_parse/include
    -I ../esp32p4-dongle/components/amv_js/quickjs-ng
