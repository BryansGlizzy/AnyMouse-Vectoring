; Builds the dongle firmware with PlatformIO, which fetches the pinned ESP-IDF v5.5.4 itself, so no
; separate ESP-IDF install is needed (the idf.py flow in README.md still works and stays the reference).
;   pio run -e p4                      -> .pio/build/p4/firmware.bin (app image, flashes at 0x20000)
; Flash only the app, so the NVS profiles survive (always through the UART USB-C):
;   esptool --chip esp32p4 -p /dev/ttyACM0 -b 460800 write-flash --flash-mode dio --flash-freq 40m \
;       --flash-size 16MB 0x20000 .pio/build/p4/firmware.bin
; The project's sdkconfig.defaults and partitions.csv are used as they are; the chip revision
; (v1.3, CONFIG_ESP32P4_SELECTS_REV_LESS_V3), 360 MHz CPU and 200 MHz PSRAM come out right by default.
[platformio]
src_dir = main

[env:p4]
platform = espressif32
board = esp32-p4-evboard
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
